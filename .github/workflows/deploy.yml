name: Deploy to cPanel (sawebsite.paperless.et)

# Auto-deploys the site to the cPanel subdomain on every push to master
# (using repo secrets), and can also be run on demand from the Actions tab /
# API with the FTP details passed as inputs (handy before secrets are set).
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      ftp_server:
        description: "FTP host (falls back to FTP_SERVER secret)"
        required: false
      ftp_username:
        description: "FTP username (falls back to FTP_USERNAME secret)"
        required: false
      ftp_password:
        description: "FTP password (falls back to FTP_PASSWORD secret)"
        required: false
      protocol:
        description: "ftp or ftps"
        required: false
        default: "ftps"

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensure any credentials passed as inputs are redacted from the logs.
      - name: Protect credentials in logs
        env:
          FP: ${{ github.event.inputs.ftp_password }}
          FU: ${{ github.event.inputs.ftp_username }}
        run: |
          [ -n "$FP" ] && echo "::add-mask::$FP" || true
          [ -n "$FU" ] && echo "::add-mask::$FU" || true

      - name: Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ github.event.inputs.ftp_server   || secrets.FTP_SERVER }}
          username: ${{ github.event.inputs.ftp_username || secrets.FTP_USERNAME }}
          password: ${{ github.event.inputs.ftp_password || secrets.FTP_PASSWORD }}
          protocol: ${{ github.event.inputs.protocol || 'ftps' }}
          port: 21
          # Main "paperlao" account: FTP home = /home/paperlao, so the subdomain
          # docroot /home/paperlao/sawebsite is "sawebsite/".
          server-dir: sawebsite/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CLAUDE.md
